[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrm-kb-syariah"
version = "0.3.0"
description = "Controlled Liquidity Risk Management — Islamic banking, WP0–WP2"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary — subject to Bank/RiseTIn agreement"}
authors = [{name = "RiseTIn Engineering"}]
dependencies = ["pydantic>=2.10,<3", "openpyxl>=3.1,<4", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
platform = [
 "pandas>=2.2,<3", "streamlit>=1.40,<2",
 "altair>=5,<6", "psycopg[binary]>=3.2,<4"
]
dev = [
 "pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7",
 "ruff>=0.8,<1", "mypy>=1.13,<2", "bandit>=1.8,<2",
 "pip-audit>=2.7,<3", "cyclonedx-bom>=5,<8", "build>=1.2,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lrm_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lrm_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["unit: unit tests", "security: guard tests", "integration: integration tests"]

[tool.coverage.run]
source = ["lrm_engine"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 90
