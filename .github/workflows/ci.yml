name: LRM WP0-WP2 CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Mypy strict engine
        run: mypy --strict src/lrm_engine
      - name: Seed activation guard
        run: python scripts/check_regulatory_seeds.py
      - name: Data contract and maker-checker SIT (SQLite test double)
        run: pytest tests/integration -q
      - name: Compile PostgreSQL Alembic migration offline
        env:
          LRM_DATABASE_URL: postgresql+psycopg://offline:offline@localhost/lrm
        run: alembic upgrade head --sql > /dev/null
      - name: Full suite + branch-aware implementation coverage
        run: pytest tests --cov=lrm_engine --cov=lrm_data --cov=lrm_services --cov-branch --cov-report=term-missing --cov-fail-under=90
      - name: Bandit SAST
        run: bandit -r src -q
      - name: Dependency audit
        run: pip-audit
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment --output-format JSON --output-file artifacts/sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: lrm-sbom
          path: artifacts/sbom.json
  postgresql-real-smoke:
    name: PostgreSQL 16 isolated synthetic migration and controls
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lrm_ci
          POSTGRES_PASSWORD: lrm_ci_only_synthetic
          POSTGRES_DB: lrm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LRM_DATABASE_URL: postgresql+psycopg://lrm_ci:lrm_ci_only_synthetic@localhost:5432/lrm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'psycopg[binary]>=3.2,<4'
      - name: Upgrade all revisions against real PostgreSQL
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Real PostgreSQL synthetic maker-checker and raw-DML negative tests
        run: python scripts/postgresql_smoke_test.py
      - name: Real PostgreSQL SFT immutable ledger smoke
        run: python scripts/postgresql_sft_smoke_test.py
